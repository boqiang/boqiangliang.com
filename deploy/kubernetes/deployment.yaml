apiVersion: apps/v1
kind: Deployment
metadata:
  name: boqiangliang-com
  namespace: boqiangliang-com
  labels:
    app.kubernetes.io/name: boqiangliang-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boqiangliang-com
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boqiangliang-com
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: 192.168.0.201:5000/boqiangliang-com/web:sha-f82b5a3a40b771b094ff500b0b9d4aa71a70eef4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - name: visitor-data
              mountPath: /data
      volumes:
        - name: visitor-data
          persistentVolumeClaim:
            claimName: boqiangliang-com-visitor-data
